name: Build Harbor for Mac

on:
  push:
    branches: [main]
    paths:
      - Harbor.swift
      - Tunnel.swift
      - TunnelSettings.swift
      - tests/**
      - server/**
      - build-macos.sh
      - RELEASE_NOTES.md
      - .github/workflows/build-macos.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harbor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify both Mac architectures
        run: bash build-macos.sh
      - name: Test encrypted browsing and blocked fallback
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv build/test-env
          build/test-env/bin/pip install -r server/requirements.txt
          build/test-env/bin/python -m unittest discover -s tests -v
          HARBOR_TOKEN=test-only-token-not-a-real-secret-123456789 PORT=18765 build/test-env/bin/python server/tunnel.py > build/tunnel.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:18765/health; then break; fi
            sleep 1
          done
          xcrun swiftc Tunnel.swift tests/TunnelSmoke.swift -framework Cocoa -framework WebKit -framework Network -o build/tunnel-smoke
          build/tunnel-smoke
      - name: Check that the packaged app starts
        shell: bash
        run: |
          set -euo pipefail
          smoke_dir=$(mktemp -d)
          ditto -x -k dist/Harbor-macOS.zip "$smoke_dir"
          "$smoke_dir/Harbor.app/Contents/MacOS/Harbor" > build/startup.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true; rm -rf "$smoke_dir"' EXIT
          sleep 5
          if ! kill -0 "$app_pid" 2>/dev/null; then
            cat build/startup.log
            echo 'Harbor exited during the startup check.' >&2
            exit 1
          fi
          echo 'Harbor remained running through the startup check.'
      - name: Save build files
        uses: actions/upload-artifact@v4
        with:
          name: Harbor-macOS
          path: |
            dist/Harbor-macOS.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
      - name: Publish downloadable app
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" \
            dist/Harbor-macOS.zip dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Harbor 0.2 — build ${GITHUB_RUN_NUMBER}" \
            --notes-file RELEASE_NOTES.md --latest
