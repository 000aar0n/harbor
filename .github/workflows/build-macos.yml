name: Build eloter for Mac

on:
  push:
    branches: [main]
    paths:
      - assets/**
      - Harbor.swift
      - MouseCapture.swift
      - Tunnel.swift
      - TunnelSettings.swift
      - tests/**
      - server/**
      - build-macos.sh
      - RELEASE_NOTES.md
      - .github/workflows/build-macos.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harbor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify optimized Apple Silicon app
        run: bash build-macos.sh
      - name: Test encrypted browsing and blocked fallback
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv build/test-env
          build/test-env/bin/pip install -r server/requirements.txt
          build/test-env/bin/python -m unittest discover -s tests -v
          HARBOR_TOKEN=test-only-token-not-a-real-secret-123456789 PORT=18765 build/test-env/bin/python server/tunnel.py > build/tunnel.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:18765/health; then break; fi
            sleep 1
          done
          xcrun swiftc Tunnel.swift tests/TunnelSmoke.swift -framework Cocoa -framework WebKit -framework Network -o build/tunnel-smoke
          build/tunnel-smoke
      - name: Test native pointer lock and release
        shell: bash
        run: |
          xcrun swiftc MouseCapture.swift tests/PointerSmoke.swift -framework Cocoa -framework WebKit -o build/pointer-smoke
          build/pointer-smoke
      - name: Check that the packaged app starts
        shell: bash
        run: |
          set -euo pipefail
          smoke_dir=$(mktemp -d)
          ditto -x -k dist/eloter-AppleSilicon.zip "$smoke_dir"
          trap 'rm -rf "$smoke_dir"' EXIT
          bash tests/check-startup.sh "$smoke_dir/eloter.app"
      - name: Save build files
        uses: actions/upload-artifact@v4
        with:
          name: eloter-AppleSilicon
          path: |
            dist/eloter-AppleSilicon.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
      - name: Publish downloadable app
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" \
            dist/eloter-AppleSilicon.zip dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "eloter 0.2.8 — build ${GITHUB_RUN_NUMBER}" \
            --notes-file RELEASE_NOTES.md --latest
