name: Verified Gecko Apple Silicon macOS 26 build
on:
  push:
    branches: [codex/gecko-arm26-verified]
    paths: [.github/workflows/gecko-arm26-verified.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gecko-arm26-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.1'
      - name: Test Node tunnel backend
        run: |
          npm ci --prefix gecko --omit=dev --ignore-scripts
          npm --prefix gecko test
      - name: Package Gecko runtime and Node backend
        run: bash build-gecko-macos.sh
      - name: Verify native control panel and backend startup
        run: |
          mkdir -p build/unpacked
          ditto -x -k dist/eloter-Gecko-AppleSilicon.zip build/unpacked
          bash tests/check-startup.sh "$PWD/build/unpacked/eloter.app"
      - name: Test real Gecko engine, mouse capture, and Node tunnel
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv build/test-env
          build/test-env/bin/pip install -r server/requirements.txt selenium==4.52.0
          build/test-env/bin/python -m unittest discover -s tests -p test_server.py -v
          curl -fL --retry 3 https://github.com/mozilla/geckodriver/releases/download/v0.37.1/geckodriver-v0.37.1-macos-aarch64.tar.gz -o build/geckodriver.tar.gz
          tar -xzf build/geckodriver.tar.gz -C build
          HARBOR_TOKEN=test-only-token-not-a-real-secret-123456789 PORT=18765 build/test-env/bin/python server/tunnel.py > build/tunnel.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:18765/health; then break; fi
            sleep 1
          done
          build/test-env/bin/python tests/gecko-smoke.py "$PWD/build/unpacked/eloter.app"
      - name: Save build files
        uses: actions/upload-artifact@v4
        with:
          name: eloter-Gecko-AppleSilicon-mac26-verified
          path: |
            dist/eloter-Gecko-AppleSilicon.zip
            dist/SHA256SUMS
          retention-days: 3
          if-no-files-found: error
