name: Build eloter Chrome tunnel
on:
  push:
    branches: [main]
    paths:
      - chrome-extension/**
      - .github/workflows/build-chrome.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: harbor-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: chrome-extension/companion/package-lock.json
      - name: Install pinned dependency
        run: npm ci --prefix chrome-extension/companion --ignore-scripts
      - name: Test proxy and policy handling
        run: npm --prefix chrome-extension/companion test
      - name: Install browser test tools
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Test actual Chromium extension and fail-closed routing
        run: python chrome-extension/tests/browser-smoke.py
      - name: Build and verify ZIP
        run: python chrome-extension/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: eloter-Chrome
          path: chrome-extension/dist/*
          retention-days: 7
      - name: Publish Chrome edition
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "chrome-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" chrome-extension/dist/* --title "eloter Chrome tunnel 0.4.0" --notes-file chrome-extension/RELEASE_NOTES.md --latest
